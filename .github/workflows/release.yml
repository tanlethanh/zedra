name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            cross: false
          # - target: x86_64-apple-darwin
          #   runner: macos-14
          #   cross: false
          # Build Linux artifacts on Ubuntu 22.04 so GNU binaries do not inherit
          # ubuntu-latest's newer glibc baseline.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            cross: true
            smoke_test: false
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            cross: false
            smoke_test: true
          - target: aarch64-pc-windows-msvc
            runner: windows-2022
            cross: false
            smoke_test: false

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        shell: bash
        env:
          ZEDRA_GA_MEASUREMENT_ID: ${{ secrets.ZEDRA_GA_MEASUREMENT_ID }}
          ZEDRA_GA_API_SECRET: ${{ secrets.ZEDRA_GA_API_SECRET }}
        run: |
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi

          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build -p zedra-host --release --target ${{ matrix.target }}
          else
            cargo build -p zedra-host --release --target ${{ matrix.target }}
          fi

      - name: Smoke test CLI
        if: ${{ matrix.smoke_test != false }}
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          binary="./zedra"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            binary="./zedra.exe"
          fi

          version_output="$("$binary" --version)"
          if [ -z "$version_output" ]; then
            echo "zedra --version produced no output" >&2
            exit 1
          fi

          "$binary" --help > zedra-help.txt
          grep -q "Commands" zedra-help.txt

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          binary="zedra"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            binary="zedra.exe"
          fi
          tar czf zedra-${{ matrix.target }}.tar.gz "$binary"
          shasum -a 256 zedra-${{ matrix.target }}.tar.gz > zedra-${{ matrix.target }}.tar.gz.sha256 || \
            sha256sum zedra-${{ matrix.target }}.tar.gz > zedra-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zedra-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/zedra-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/zedra-${{ matrix.target }}.tar.gz.sha256

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-release

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Write signing keystore
        working-directory: android
        env:
          ZEDRA_KEYSTORE_BASE64: ${{ secrets.ZEDRA_KEYSTORE_BASE64 }}
        run: echo "$ZEDRA_KEYSTORE_BASE64" | base64 -d > zedra-release.keystore

      - name: Write google-services.json
        working-directory: android
        env:
          ZEDRA_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ZEDRA_GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$ZEDRA_GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PZEDRA_KEYSTORE=zedra-release.keystore \
            -PZEDRA_KEYSTORE_ALIAS="${{ secrets.ZEDRA_KEYSTORE_ALIAS }}" \
            -PZEDRA_KEYSTORE_PASSWORD="${{ secrets.ZEDRA_KEYSTORE_PASSWORD }}"

      - name: Package APK
        working-directory: android
        run: |
          apk="$(find app/build/outputs/apk/release -name '*-release.apk' | head -n1)"
          cp "$apk" zedra-android-arm64-v8a.apk
          shasum -a 256 zedra-android-arm64-v8a.apk > zedra-android-arm64-v8a.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zedra-android-arm64-v8a
          path: |
            android/zedra-android-arm64-v8a.apk
            android/zedra-android-arm64-v8a.apk.sha256

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.apk
            artifacts/**/*.sha256
